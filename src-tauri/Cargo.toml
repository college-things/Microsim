[package]
name = "microsim"
version = "0.9.0"
description = "Lightweight circuit simulator with an AI assistant"
edition = "2021"
license = "MIT"

[lib]
name = "microsim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Keep these on the same minor versions as the @tauri-apps npm packages in package.json.
tauri = { version = "~2.12", features = [] }
tauri-plugin-dialog = "~2.8"
tauri-plugin-fs = "~2.7"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
