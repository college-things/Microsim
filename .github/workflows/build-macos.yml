name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-latest
    env:
      HAS_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Signing and notarization run when the certificate secret is set. Without it the build is
      # unsigned, and macOS will warn people who download it. Tauri treats a variable that is set
      # but empty as a request to sign, so these are only set when there is a certificate.
      - name: Enable signing
        if: ${{ env.HAS_CERTIFICATE == 'true' }}
        # Base64 tools often wrap their output, and a line break would break GITHUB_ENV.
        run: |
          add() { if [ -n "$2" ]; then echo "$1=$(printf '%s' "$2" | tr -d '\r\n')" >> "$GITHUB_ENV"; fi; }
          add APPLE_CERTIFICATE "$CERT"
          add APPLE_CERTIFICATE_PASSWORD "$CERT_PASSWORD"
          add APPLE_SIGNING_IDENTITY "$IDENTITY"
          add APPLE_ID "$ID"
          add APPLE_PASSWORD "$PASSWORD"
          add APPLE_TEAM_ID "$TEAM"
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          ID: ${{ secrets.APPLE_ID }}
          PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
      - run: npx tauri build --target universal-apple-darwin
      - name: Launch test
        run: |
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/Ohmlet.app
          codesign --verify --deep --verbose=2 "$app"
          "$app/Contents/MacOS/ohmlet" > launch.log 2>&1 &
          pid=$!
          sleep 20
          screencapture -x launch.png || true
          # Use the real menus to open an example and run it, which exercises the native menu
          # and the simulation worker under the macOS webview. Runners may refuse UI scripting,
          # so a refusal is reported in the log and doesn't fail the build.
          proc=$(osascript -e 'tell application "System Events" to get name of first process whose unix id is '"$pid" 2>> launch.log) || true
          echo "process: $proc" >> launch.log
          osascript -e "tell application \"System Events\" to tell process \"$proc\"" \
            -e 'set frontmost to true' \
            -e 'click menu item "RC low-pass filter" of menu "Examples" of menu bar 1' \
            -e 'delay 2' \
            -e 'click menu item "Run" of menu "Simulate" of menu bar 1' \
            -e 'end tell' >> launch.log 2>&1 || echo "menu scripting failed" >> launch.log
          sleep 12
          screencapture -x running.png || true
          cat launch.log
          kill -0 "$pid"
          kill "$pid"
      - uses: actions/upload-artifact@v4
        with:
          name: Ohmlet-macOS
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-details
          path: |
            launch.png
            running.png
            launch.log
            src-tauri/Cargo.lock
          if-no-files-found: warn
