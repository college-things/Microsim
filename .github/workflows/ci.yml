name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # gpasm checks the PIC assembler independently; its test skips where gputils is absent.
      - name: Install gputils
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gputils
      - run: npm run typecheck
      # Tests that need the local Multisim installation or installed compilers skip themselves here.
      - run: npm test
      - run: npm run test:bridge
      - run: npm run build:web
