name: Linux smoke test

# Builds and installs the Linux .deb, starts the app on a virtual display, opens the first example from
# its menu, runs it with F5, checks the process is still alive, and keeps screenshots. Run by hand.
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build dependencies and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb imagemagick xdotool fluxbox tesseract-ocr
      - run: npm ci
      - run: npx tauri build --bundles deb
      - name: Launch, open an example and run it
        run: |
          sudo dpkg -i src-tauri/target/release/bundle/deb/*.deb || sudo apt-get -f install -y
          export DISPLAY=:99
          # A virtual display has no GPU: WebKitGTK must render in software or it paints nothing.
          export WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 LIBGL_ALWAYS_SOFTWARE=1
          Xvfb :99 -screen 0 1440x900x24 &
          sleep 3
          # Without a window manager the app's window is never mapped, and nothing can be captured.
          fluxbox > /dev/null 2>&1 &
          sleep 2
          microsim > launch.log 2>&1 &
          pid=$!
          sleep 15
          win=$(xdotool search --onlyvisible --pid "$pid" --name '^Microsim$' | head -1)
          test -n "$win"
          xdotool windowmap --sync "$win"
          xdotool windowsize "$win" 1320 840 windowmove "$win" 20 20
          xdotool windowactivate --sync "$win" windowraise "$win"
          xwininfo -id "$win" >> launch.log
          sleep 3
          # Capture the client window itself. Root captures can omit child windows on Xvfb.
          import -window "$win" launched.png
          # The window title is Microsim; drive its menus with the keyboard-free xdotool search.
          echo "window: $win" >> launch.log
          kill -0 "$pid"
          # Open the Examples menu by clicking its position in the native menu bar, then the first example.
          if [ -n "$win" ]; then
            xdotool windowactivate --sync "$win" || true
            # File is the first native menu, Examples the second. F10 avoids title-bar offsets.
            xdotool key F10 Right Down && sleep 1
            import -screen -window root menu.png
            xdotool key Down Return && sleep 3
            xdotool key F5 && sleep 10
          fi
          import -window "$win" running.png
          tesseract launched.png launched 2>/dev/null
          tesseract running.png running 2>/dev/null
          cat launched.txt running.txt >> launch.log
          # A living process or an empty desktop is insufficient evidence of a working app.
          grep -Eiq 'Microsim|Examples|Simulate|resistor' launched.txt
          grep -Eiq 'RC low.pass|low.pass filter' running.txt
          kill -0 "$pid"
          kill "$pid"
          cat launch.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-smoke
          path: |
            *.png
            launch.log
            *.txt
